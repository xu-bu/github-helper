<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GitHub Helper</title>
    <style>
      body { font: 14px -apple-system, sans-serif; margin: 24px; max-width: 480px; }
      input { width: 100%; padding: 6px; box-sizing: border-box; margin: 6px 0 12px; }
      button { padding: 6px 14px; cursor: pointer; }
      #status { margin-left: 10px; color: #1a7f37; }
      small { color: #666; display: block; margin-top: 12px; }
    </style>
  </head>
  <body>
    <h3>GitHub token</h3>
    <label for="host">Host</label>
    <select id="host" style="display:block;margin:6px 0 12px;padding:6px;"></select>
    <label for="token">Read-only fine-grained token (needed for private repos)</label>
    <input id="token" type="password" placeholder="github_pat_..." autocomplete="off" />
    <button id="save">Save</button>
    <button id="clear">Clear</button>
    <button id="test">Test</button>
    <span id="status"></span>
    <small>Stored locally in this browser only. Reload open GitHub tabs after saving.</small>
    <script src="options.js"></script>
  </body>
</html>
